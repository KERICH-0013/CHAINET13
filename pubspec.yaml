name: chainet_app
description: Smarter Tea Farming
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  open_meteo: ^3.0.0
  http: ^1.1.0
  provider: ^6.1.2
  hive_flutter: ^1.1.0

  # Firebase (compatible with Core 3.13.0)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  cloud_functions: ^5.6.2

  # UI
  pin_code_fields: ^8.0.1

  # Camera & Gallery
  camera: ^0.10.5
  image_picker: ^1.0.4
  file_picker: ^8.1.7

  # Utilities
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/background.jpg
    - assets/images/dashboard.jpg
    - assets/images/dashboard2.jpg
    - assets/images/market.jpg
    - assets/images/farming guide.jpg
    - assets/images/chatbot.jpg
    - assets/images/weather.jpg
    - assets/images/register.jpg
    - assets/images/login.jpg
    - assets/images/about.jpg
    - assets/images/about1.jpg
    - assets/images/Adminpage images/admin_bg.jpg
    - assets/images/Farmingguide/prun.png
    - assets/images/Farmingguide/harvest.png
    - assets/images/Farmingguide/prunknife.png
    - assets/images/Farmingguide/Npk.png
    - assets/images/vision1.jpg
    - assets/images/vision2.jpg
    - assets/images/vision3.jpg
    - assets/images/pruning_methods.png
    - assets/images/unlock.jpg
    - assets/images/notification.jpg